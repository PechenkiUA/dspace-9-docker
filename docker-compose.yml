name: dspace

services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: dspace-db
    environment:
      POSTGRES_DB: ${DB_NAME:-dspace}
      POSTGRES_USER: ${DB_USER:-dspace}
      POSTGRES_PASSWORD: ${DB_PASS:-dspace}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - dspace-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dspace} -d ${DB_NAME:-dspace}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─── Solr ─────────────────────────────────────────────────────────────────────
  solr:
    build:
      context: .
      dockerfile: Dockerfile.solr
      args:
        DSPACE_VERSION: ${DSPACE_VERSION:-9.0}
    container_name: dspace-solr
    environment:
      SOLR_OPTS: "-Dsolr.config.lib.enabled=true"
    volumes:
      - solrdata:/var/solr
    ports:
      - "${SOLR_PORT:-8983}:8983"
    networks:
      - dspace-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8983/solr/search/admin/ping"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ─── DSpace Backend (REST API) ────────────────────────────────────────────────
  dspace:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        DSPACE_VERSION: ${DSPACE_VERSION:-9.0}
    container_name: dspace-backend
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dspace}
      DB_USER: ${DB_USER:-dspace}
      DB_PASS: ${DB_PASS:-dspace}
      SOLR_HOST: solr
      SOLR_PORT: 8983
      DSPACE_SERVER_URL: ${DSPACE_SERVER_URL:-http://localhost:8080/server}
      DSPACE_UI_URL: ${DSPACE_UI_URL:-http://localhost:4000}
      DSPACE_NAME: ${DSPACE_NAME:-My DSpace Repository}
      DSPACE_ADMIN_EMAIL: ${DSPACE_ADMIN_EMAIL:-admin@example.com}
      DSPACE_ADMIN_PASS: ${DSPACE_ADMIN_PASS:-admin}
      DSPACE_ADMIN_FIRSTNAME: ${DSPACE_ADMIN_FIRSTNAME:-DSpace}
      DSPACE_ADMIN_LASTNAME: ${DSPACE_ADMIN_LASTNAME:-Administrator}
      JAVA_OPTS: "${JAVA_OPTS:--Xmx2g -Xms512m -Dfile.encoding=UTF-8}"
    volumes:
      - assetstore:/dspace/assetstore
      - dspacelogs:/dspace/log
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - dspace-net
    restart: unless-stopped

  # ─── DSpace Frontend (Angular UI) ─────────────────────────────────────────────
  dspace-ui:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        DSPACE_VERSION: ${DSPACE_VERSION:-9.0}
    container_name: dspace-frontend
    depends_on:
      - dspace
    environment:
      DSPACE_UI_SSL: "false"
      DSPACE_UI_HOST: "0.0.0.0"
      DSPACE_UI_PORT: "4000"
      DSPACE_UI_NAMESPACE: "/"
      DSPACE_REST_SSL: "false"
      DSPACE_REST_HOST: ${DSPACE_REST_HOST:-localhost}
      DSPACE_REST_PORT: ${BACKEND_PORT:-8080}
      DSPACE_REST_NAMESPACE: "/server"
      NODE_OPTIONS: "--max-old-space-size=2048"
    ports:
      - "${FRONTEND_PORT:-4000}:4000"
    networks:
      - dspace-net
    restart: unless-stopped

volumes:
  pgdata:
  solrdata:
  assetstore:
  dspacelogs:

networks:
  dspace-net:
    driver: bridge
